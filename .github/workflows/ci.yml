name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # monthly link check

jobs:
  prek:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install deps
        # puppeteer's postinstall downloads Chrome, which only site-assets.yml needs (and
        # installs itself); pnpm fails CI installs on unapproved build scripts, so deny it
        run: &pnpm-install corepack enable && pnpm install --allow-build '!puppeteer'
        working-directory: site
      # the vp-staged prek hook is a no-op without staged files, so check everything here
      - name: Format, lint and type-check
        run: |
          pnpm exec svelte-kit sync # generates node_modules/$app/tsconfig.json which tsconfig.json extends
          pnpm exec vp check
          pnpm exec svelte-check --threshold error
        working-directory: site
      - name: Run prek
        uses: j178/prek-action@v3.1.0

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Discover broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --accept 200..=206,429,403,500,502,503,530
            --accept-timeouts
            --max-retries 3
            --retry-wait-time 5
            --timeout 60
            --exclude '%7B'
            --exclude 'npmjs.com'
            --exclude 'linkedin.com'
            --exclude 'github.com/janosh/awesome-sveltekit/network'
            --exclude 'tauri.app'
            --exclude-path 'site/src/site-metadata.yml'
            -- ./**/*.{md,svelte,ts,yml}

  tests:
    if: github.event_name != 'schedule'
    uses: janosh/workflows/.github/workflows/npm-test.yml@main
    with:
      working-directory: site
      install-cmd: *pnpm-install
      test-cmd: npx vp test run
      e2e-test-cmd: npx playwright test
      e2e-install-cmd: npx playwright install chromium

  build:
    if: github.event_name != 'schedule'
    uses: janosh/workflows/.github/workflows/nodejs-gh-pages.yml@main
    with:
      node-version: 24
      working-directory: site
      install-cmd: *pnpm-install
      # the homepage lists repo contributors; a token avoids the shared runners' IP rate limit
      build-cmd: GITHUB_TOKEN=${{ github.token }} pnpm run build
