default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: file-contents-sorter
        files: ^tools\.yml$
      - id: deny-pattern
        name: 'Brackets should not be inside links [[link]](url) -> [[link](url)]'
        args: ['\]\]\(']
        types: [markdown]
      - id: deny-pattern
        name: URLs must use HTTPS
        args: ['http:']
        types_or: [markdown, yaml]
        exclude: .pre-commit-config.yaml
      - id: deny-pattern
        name: No repeated spaces
        args: ['\S+\s{2,}']
        types: [text]
        exclude_types: [javascript, ts]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--config-file, .github/yamllint.yml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # MD013: line too long
        # MD033: no inline HTML
        # MD041: first line in a file should be a top-level heading
        args: [--disable, MD013, MD033, MD041, '--']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^site/src/site-metadata.yml$
        args: [--ignore-words-list, 'ons,linz', --check-filenames]
        stages: [pre-commit, commit-msg]

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        types: [text]
        args: []
        exclude: ^site/src/site-metadata.yml|.pre-commit-config.yaml$

  - repo: local
    hooks:
      - id: avif-screenshots
        name: Screenshots must use AVIF format
        entry: screenshot filenames must end in .avif
        language: fail
        files: '^site/static/screenshots/.*(?<!\.avif)$'

      - id: format-urls
        name: Format URLs
        entry: .github/format_urls.py
        language: python
        files: ^(sites.yml|readme.md|.github/format_urls.py)$

  - repo: local
    hooks:
      - id: vp-check
        name: Format + Lint (vite-plus)
        entry: bash -c 'cd site && npx svelte-kit sync && node_modules/.bin/vp check --fix'
        types_or: [file]
        language: system
        pass_filenames: false
      - id: svelte-check
        name: Svelte type check
        entry: bash -c 'cd site && npx svelte-kit sync && npx svelte-check --threshold error'
        language: system
        types_or: [ts, svelte]
        pass_filenames: false
